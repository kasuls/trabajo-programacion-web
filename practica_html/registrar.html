<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registrar</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <h2>registrar</h2>
    <form id ="registro">
    <label for="usuario">Usuario</label>
    <br>
    <input type="text" id ="usuario" placeholder="introduzca un usuario" required>
    <br> 
    <label for="email">Email</label>
    <br>
    <input type="email" id ="email" placeholder="introduzca el email" required>
    <br>
    <label for="lat">latitud</label>
    <br>
    <input type="number" id="lat" placeholder="introduzca la latitud" required>
    <br>
    <label for="alt">altitud</label>
    <br>
    <input type="number" id="alt" placeholder="introduzca la altitud" required>
    <br>
    <label for="contraseña">Contraseña</label>
    <br>
    <input type="password" id="contraseña" placeholder="introduzca la contraseña" required>
    <br>
    <label for="contraseña">confirmacion de Contraseña</label>
    <br>
    <input type="password" id="confirmar" placeholder="introfuzca la contraseña" required>
    <br>
    <button class="boton" type="submit">enviar</button>
    </form>

    <script src="java/registrar.js"></script>
</body>

</html>
